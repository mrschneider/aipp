name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build (experiments need the debug binaries)
        run: cargo build --workspace
      - name: Dual-plane E2E
        run: python3 experiments/experiment_001_dual_plane.py
      - name: Hardening E2E
        run: python3 experiments/experiment_002_hardening.py
      - name: TLS E2E
        run: python3 experiments/experiment_003_tls.py
      - name: Federation E2E
        run: python3 experiments/experiment_004_federation.py

  assets:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/aipp-broker dist/
          tar czf aipp-${{ matrix.target }}.tar.gz -C dist aipp-broker
          sha256sum aipp-${{ matrix.target }}.tar.gz > aipp-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            aipp-${{ matrix.target }}.tar.gz
            aipp-${{ matrix.target }}.tar.gz.sha256

  publish:
    runs-on: ubuntu-latest
    needs: assets
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
