[workspace]
members = ["aipp-core", "aipp-broker"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Guilherme <guilherme.barcha@gmail.com>"]
repository = "https://github.com/mrschneider/aipp"

[workspace.dependencies]
aipp-core = { path = "aipp-core" }
serde_json = "1"
hmac = "0.12"
rustls = "0.23"
rustls-pemfile = "2"
sha2 = "0.10"
